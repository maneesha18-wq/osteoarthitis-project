services:
  # ===========================================================================
  # 1. FastAPI + TensorFlow Deep Learning Inference Engine
  # ===========================================================================
  - type: web
    name: kneeai-backend
    runtime: python
    region: oregon
    plan: free # Can upgrade to starter ($7/mo) for persistent in-memory weights & zero cold starts
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_DIR
        value: ml/artifacts
      - key: MODEL_PATH
        value: ml/artifacts/mobilenetv2_knee_kl.keras
      - key: MAX_UPLOAD_SIZE
        value: 10485760

  # ===========================================================================
  # 2. Next.js 14 Web Frontend
  # ===========================================================================
  - type: web
    name: kneeai-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false # Set in the Render dashboard to your Supabase Project URL
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false # Set in the Render dashboard to your Supabase publishable anon key
      - key: NEXT_PUBLIC_API_URL
        value: https://kneeai-backend.onrender.com
